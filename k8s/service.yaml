apiVersion: v1
kind: Service
metadata:
  name: hirehub-backend-service
  labels:
    app: hirehub-backend
    module: m7-kubernetes
spec:
  type: NodePort
  selector:
    app: hirehub-backend
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
