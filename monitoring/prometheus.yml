global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional placeholder)
alerting:
  alertmanagers: []

# Scrape configurations for HireHub Job Portal services
scrape_configs:
  # Primary scrape target: HireHub Express API Backend & Metrics
  - job_name: 'hirehub-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets:
          - 'backend:5000'
          - 'localhost:5000'
          - '127.0.0.1:5000'
        labels:
          app: 'hirehub-job-portal'
          service: 'backend-api'
          environment: 'production'

  # Prometheus self-monitoring scrape target
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          app: 'prometheus-server'
          service: 'monitoring'
