name: Job Portal DevOps CI/CD & Kubernetes Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-deploy:
    name: Build Containers, Verify Compose, Publish to GHCR & Verify Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Root Unified Docker Image
        run: |
          echo "Building root production Docker image..."
          docker build -t hirehub-unified .

      - name: Build Backend Docker Image
        run: |
          echo "Building backend Docker image..."
          docker build -t job-portal-backend ./backend

      - name: Build Frontend Test Docker Image
        run: |
          echo "Building frontend test Docker image..."
          docker build --target builder -t job-portal-frontend-test ./frontend

      - name: Build Frontend Production Docker Image
        run: |
          echo "Building frontend production Nginx Docker image..."
          docker build -t job-portal-frontend ./frontend

      - name: Run Unit Tests Inside Backend Docker Container
        run: |
          echo "Executing tests inside backend Docker image..."
          docker run --rm job-portal-backend npm test

      - name: Run Unit Tests Inside Frontend Docker Container
        run: |
          echo "Executing tests inside frontend Docker image..."
          docker run --rm job-portal-frontend-test npm test

      - name: Validate Docker Compose Configuration & Stack
        run: |
          echo "Validating docker-compose configuration..."
          docker compose config
          
          echo "Starting Docker Compose services (mongodb, backend, frontend)..."
          docker compose up -d
          
          echo "Waiting for services to become healthy..."
          sleep 15
          
          docker compose ps
          
          echo "Verifying backend health endpoint..."
          curl -f http://localhost:5000/api/health || exit 1
          
          echo "Verifying backend Prometheus metrics endpoint..."
          curl -f http://localhost:5000/metrics | grep "job_portal_app_health" || exit 1
          
          echo "Tearing down compose stack..."
          docker compose down

      - name: Tag Images with Commit SHA and Latest
        run: |
          echo "Tagging local Docker images with commit SHA: ${{ github.sha }}"
          docker tag hirehub-unified hirehub-unified:${{ github.sha }}
          docker tag job-portal-backend job-portal-backend:${{ github.sha }}
          docker tag job-portal-frontend job-portal-frontend:${{ github.sha }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and Push Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Tagging images for GHCR repository: ghcr.io/${REPO_LOWER}"
          docker tag hirehub-unified ghcr.io/${REPO_LOWER}/hirehub-job-portal:${{ github.sha }}
          docker tag hirehub-unified ghcr.io/${REPO_LOWER}/hirehub-job-portal:latest
          docker tag job-portal-backend ghcr.io/${REPO_LOWER}/job-portal-backend:${{ github.sha }}
          docker tag job-portal-frontend ghcr.io/${REPO_LOWER}/job-portal-frontend:${{ github.sha }}
          docker tag job-portal-backend ghcr.io/${REPO_LOWER}/job-portal-backend:latest
          docker tag job-portal-frontend ghcr.io/${REPO_LOWER}/job-portal-frontend:latest
          
          echo "Pushing SHA-tagged and latest images to GHCR..."
          docker push ghcr.io/${REPO_LOWER}/hirehub-job-portal:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/hirehub-job-portal:latest
          docker push ghcr.io/${REPO_LOWER}/job-portal-backend:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/job-portal-frontend:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/job-portal-backend:latest
          docker push ghcr.io/${REPO_LOWER}/job-portal-frontend:latest

      - name: Setup kind Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: hirehub-k8s-cluster

      - name: Deploy and Verify Kubernetes Manifests
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Tagging and loading image into kind cluster..."
          docker tag job-portal-backend ghcr.io/${REPO_LOWER}/job-portal-backend:latest
          kind load docker-image ghcr.io/${REPO_LOWER}/job-portal-backend:latest --name hirehub-k8s-cluster
          
          echo "Applying Kubernetes manifests..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
          echo "Waiting for pods to reach READY status..."
          kubectl rollout status deployment/hirehub-backend-deployment --timeout=120s
          
          echo "Kubernetes Deployment Status:"
          kubectl get deployments -o wide
          
          echo "Kubernetes Pods Status (Verification):"
          kubectl get pods -o wide
          
          echo "Kubernetes Services Status:"
          kubectl get services -o wide
