services:
  - type: web
    name: hirehub-job-portal
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb://localhost:27017/jobportal
      - key: JWT_SECRET
        value: devops-secret-key-hirehub-2026
