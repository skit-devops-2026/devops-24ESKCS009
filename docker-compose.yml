version: '3.8'

services:
  # Database Service: MongoDB
  mongodb:
    image: mongo:latest
    container_name: job-portal-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=jobportal
    volumes:
      - mongo-data:/data/db
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service: Node.js Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/jobportal
      - JWT_SECRET=devops-secret-key-hirehub-2026
    depends_on:
      - mongodb
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Service: Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-portal-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - job-portal-network

networks:
  job-portal-network:
    name: job-portal-network
    driver: bridge

volumes:
  mongo-data:
    name: mongo-data
